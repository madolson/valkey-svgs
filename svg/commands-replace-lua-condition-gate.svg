  <g><line x1="980" y1="614" x2="1085.4" y2="721.9" stroke="#46BDE9" stroke-width="11" opacity="0.45"/><line x1="1051.1" y1="755.4" x2="1119.7" y2="688.3" stroke="#46BDE9" stroke-width="11" stroke-linecap="round" opacity="0.45"/></g>
