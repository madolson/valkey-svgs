  <g><rect x="1176" y="228" width="176" height="128" rx="26" fill="#2CD5C4" fill-opacity="0.2" stroke="#2CD5C4" stroke-width="6" opacity="0.95"/><rect x="1210" y="278" width="108" height="28" rx="14" fill="#2CD5C4" opacity="0.95"/></g>
  <g><rect x="628" y="368" width="344" height="344" rx="82.6" fill="#060A24" fill-opacity="0.66" stroke="#CCF1FF" stroke-width="17.2"/><rect x="700.2" y="446.3" width="199.5" height="43" rx="21.5" fill="#CCF1FF" opacity="0.95"/><rect x="745.1" y="590.7" width="109.7" height="43" rx="21.5" fill="#CCF1FF" opacity="0.95"/></g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
