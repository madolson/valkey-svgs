<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="221.5 124.6 1476.9 830.8">
  <title>Valkey security, one bug in two places</title>
  <desc>Two identical tracks of six cells, the upper one with its fourth cell repaired in green and the lower one with the same cell still faulty in glowing red, representing a defect fixed in one implementation and left standing in the other. The title "Valkey security, one bug in two places" is set on solid light blocks in the lower left.</desc>
