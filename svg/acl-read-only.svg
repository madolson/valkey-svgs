<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="274.3 162.3 1371.4 771.4">
  <title>Valkey read-only access</title>
  <desc>A grid of abstract command names with one bounded group lit in green and a single command inside that group struck out in red, representing a read-only access control list grant with one command taken back out.</desc>
