<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="320 200 1280 720">
  <title>Valkey backported fixes</title>
  <desc>Five stacked version rails, each branching off the one above it and carrying a run of small blue commits, crossed by one bright green vertical line that places the same fix node on every rail at the same point, representing one security fix shipped to every supported version at once. The title "Valkey backported fixes" is set on solid light blocks in the lower left.</desc>
