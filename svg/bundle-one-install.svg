<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="175 90 1600 900">
  <title>Valkey bundle, one install</title>
  <desc>A port marked with the white Valkey hexagon fanning out into four module diagrams: a nested document in brackets, a bit array, a magnifier over a scatter of points, and a padlock, representing one install that delivers all four bundled modules.</desc>
