<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="232.7 130.9 1454.5 818.2">
  <title>Valkey event</title>
  <desc>A month of day cells with exactly one lit and circled in green, and travel converging on it from off the frame, representing a dated community event.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0" stop-color="#060A24"/>
      <stop offset="0.48" stop-color="#171043"/>
      <stop offset="1" stop-color="#301868"/>
    </linearGradient>
    <radialGradient id="focus" gradientUnits="userSpaceOnUse" cx="960" cy="540" r="900">
