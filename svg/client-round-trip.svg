  <title>Valkey client round trip</title>
  <desc>Three unlike client shapes on their own lifelines exchanging dashed handshakes and then coloured request and pale response arrows with a single bright server lifeline headed by the white Valkey hexagon mark, representing the request and response round trip a client library performs.</desc>
