<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="221.5 148.6 1476.9 830.8">
  <title>Valkey large key</title>
  <desc>Seven key sizes measured against a common scale, six of them short and one running clean off the frame in red, representing a single key far larger than the rest of the keyspace.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.32" y2="1">
      <stop offset="0" stop-color="#060A24"/>
      <stop offset="0.48" stop-color="#171043"/>
      <stop offset="1" stop-color="#301868"/>
    </linearGradient>
    <radialGradient id="focus" gradientUnits="userSpaceOnUse" cx="1000" cy="560" r="900">
