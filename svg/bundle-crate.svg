<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="160 90 1600 900">
  <title>Valkey bundle</title>
  <desc>One bracketed package outline sealed with the white Valkey hexagon mark, holding four module diagrams inside it: a bit array, a nested document in brackets, a magnifier over a scatter of points, and a padlock, representing the four modules valkey-bundle ships as one package. The title "Valkey bundle" is set on solid light blocks in the lower left.</desc>
