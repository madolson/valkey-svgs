<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="160 90 1600 900">
  <title>Valkey security triage</title>
  <desc>A large grid of candidate findings narrowing along two rails into a smaller grid and then into three large red cells, with discarded findings drifting away below in purple, representing most machine-generated findings failing an adversarial second look. The title "Valkey security triage" is set on solid light blocks in the lower left.</desc>
