<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="232.7 130.9 1454.5 818.2">
  <title>Valkey sorted sets, fewer levels</title>
  <desc>A tall spindly purple tree of seven thin levels with a lookup route threading one node per level, beside a short broad green tree of one wide root node fanning into three leaf nodes of packed blue members, reached in two hops, representing a high-fanout B+ tree replacing a deep pointer structure. The title "Valkey sorted sets, fewer levels" is set on solid light blocks in the lower left.</desc>
