<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="264.3 153.7 1391.3 782.6">
  <title>Valkey security</title>
  <desc>A shield woven from a single even lattice with the white Valkey hexagon mark at its centre and nothing else inside it, representing security and hardening. The title "Valkey security" is set on solid light blocks in the lower left.</desc>
