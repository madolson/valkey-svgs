<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="248.9 140 1422.2 800">
  <title>Valkey black hole</title>
  <desc>A black sphere with a bright ring of light lensed around it and the flat near edge of its accretion disk crossing in front, the white Valkey hexagon mark at the centre, representing gravity pulling everything to one place.</desc>
