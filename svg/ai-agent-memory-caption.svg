<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="215.8 121.4 1488.4 837.2">
  <title>Valkey AI agent memory</title>
  <desc>A row of conversation turns with the most recent ones lit inside a bright window, older turns dimmed and parked in an archive below the white Valkey hexagon mark, and two of them arcing back up into the window, representing agent memory with hot recent context and older context recalled on demand. The title "Valkey AI agent memory" is set on solid light blocks in the lower left.</desc>
