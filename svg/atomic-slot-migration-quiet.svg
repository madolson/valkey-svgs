<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="173.1 85.4 1573.8 885.2">
  <title>Valkey atomic slot migration</title>
  <desc>Two shard slot rings each centred on the white Valkey hexagon mark, the left one showing four contiguous slots vacated in dashed purple and the right one the same four arrived in solid green, a quiet stream of slot segments running between them, a green chevron driving that stream into the destination, and a large magnifier over the middle of the stream resolving the band into separate slots, representing watching one contiguous range migrate atomically. The title "Valkey atomic slot migration" is set on solid light blocks in the lower left.</desc>
