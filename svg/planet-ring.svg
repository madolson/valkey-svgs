<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="132.4 74.5 1655.2 931">
  <title>Planet Valkey</title>
  <desc>A wireframe globe carrying the white Valkey hexagon mark, encircled by a thick tilted ring broken into even segments that passes behind the globe and in front of it again, against a sparse starfield, representing one Valkey world wearing its whole keyspace as a ring. The title "Planet Valkey" is set on solid light blocks in the lower left.</desc>
