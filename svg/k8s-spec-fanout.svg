<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="265.9 167.6 1324.1 744.8">
  <title>Valkey items by size</title>
  <desc>A declared specification panel on the left fanning out along four baselines into a run of rounded items ordered by decreasing size, the top two several times larger than anything below them and carrying the white Valkey hexagon mark, trailing off into a long tail of small ones.</desc>
