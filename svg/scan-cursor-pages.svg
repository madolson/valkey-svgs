<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="248.9 144 1422.2 800">
  <title>Valkey scan by page</title>
  <desc>A field of key pills on an even pitch, grouped into five stacked pages, with the middle page lit in gold and the other four blue at rest, representing a scan that hands back one bounded page of the keyspace at a time. The title "Valkey scan by page" is set on solid light blocks in the lower left.</desc>
