<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="192 108 1536 864">
  <title>Valkey primitives and tools</title>
  <desc>A base course of identical small primitives with four differently detailed tools resting on runs of them, two larger composites above those, and the white Valkey hexagon mark at the top, representing tools built out of server primitives.</desc>
