<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="221.5 124.6 1476.9 830.8">
  <title>Valkey sorted sets in less memory</title>
  <desc>A scattered field of small separate member blocks, each carrying a short stack of purple pointer bars above it, over one wide green node along the bottom holding the same members as blue cells packed side by side and rising in score order, representing a sorted set index that stops spending one heap allocation per member. The title "Valkey sorted sets in less memory" is set on solid light blocks in the lower left.</desc>
