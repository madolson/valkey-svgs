<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="87.3 49.1 1745.5 981.8">
  <title>Valkey secondary indexing</title>
  <desc>Four record cards each contributing one highlighted green field to a sorted index lane below, with a query caliper bracketing three matched entries above the white Valkey hexagon mark, representing secondary indexing on hashes and JSON. The title "Valkey secondary indexing" is set on solid light blocks in the lower left.</desc>
