  <circle cx="460" cy="540" r="9" fill="#46BDE9" opacity="0.55"/>
  <g><circle cx="700" cy="418" r="26" fill="none" stroke="#46BDE9" stroke-width="3" opacity="0.5"/><circle cx="700" cy="418" r="12" fill="#46BDE9" opacity="0.55"/><circle cx="940" cy="608" r="26" fill="none" stroke="#46BDE9" stroke-width="3" opacity="0.5"/><circle cx="940" cy="608" r="12" fill="#46BDE9" opacity="0.55"/></g>
  <circle cx="1420" cy="546" r="12" fill="#CCF1FF" opacity="0.9"/>
  <circle cx="1180" cy="464" r="60" fill="url(#h-gold)" opacity="0.9"/>
  <circle cx="1180" cy="464" r="34" fill="none" stroke="#FFB81C" stroke-width="5" opacity="0.95"/>
  <circle cx="1180" cy="464" r="15" fill="#FFB81C" opacity="1"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
