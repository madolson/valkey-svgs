  <g><circle cx="592" cy="737.3" r="9" fill="#46BDE9" opacity="0.22"/><circle cx="828" cy="238.2" r="9" fill="#46BDE9" opacity="0.22"/><circle cx="864" cy="547.3" r="9" fill="#46BDE9" opacity="0.22"/><circle cx="1068" cy="791.4" r="9" fill="#46BDE9" opacity="0.22"/><circle cx="1044" cy="404.7" r="9" fill="#46BDE9" opacity="0.22"/><circle cx="1306" cy="627.4" r="9" fill="#46BDE9" opacity="0.22"/></g>
