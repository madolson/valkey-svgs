<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="243.6 137 1432.8 806">
  <title>Valkey pinned near its limit</title>
  <desc>A large gauge around the white Valkey hexagon mark, filled from blue through green into gold and stopping just short of a red end zone, representing a small resource envelope run right up to its limit. The title "Valkey pinned near its limit" is set on solid light blocks in the lower left.</desc>
